[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bowler"
version = "0.1.0"
description = "A neuroevolutionary cricket bowling simulation"
requires-python = ">=3.12"
dependencies = ["numpy", "matplotlib", "pyyaml", "pydantic>=2"]

[project.optional-dependencies]
llm = ["anthropic>=2"]
dev = ["pytest"]

[project.scripts]
aibowler-lab = "aibowler.lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
